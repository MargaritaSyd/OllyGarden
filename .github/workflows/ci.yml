name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request pushes are cancelled; every commit on main gets a full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Canonical origin for the production build that test:rss serves. Do not set NETLIFY
      # here: the prebuild validator only requires the PostHog token on Netlify deploys.
      NEXT_PUBLIC_SITE_URL: https://ollygarden.com
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing in this job pushes, so do not keep the token around for later steps.
          persist-credentials: false

      # .bun-version is the single pin for the Bun that writes bun.lock; keep it equal to
      # BUN_VERSION in netlify.toml.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # The test scripts run `node --test`, so the Node version matters independently of Bun.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests with coverage
        run: bun run test:unit

      - name: Production build and RSS/redirect suite
        run: bun run test:rss
